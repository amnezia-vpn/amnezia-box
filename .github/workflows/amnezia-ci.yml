name: Amnezia CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amnezia-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  BUILD_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale

jobs:
  quality:
    name: Module, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.5'
          cache: true
      - name: Check module consistency
        run: |
          go mod tidy -diff
          go mod verify
      - name: Vet
        run: go vet -tags "${BUILD_TAGS}" ./...
      - name: Test
        run: go test -tags "${BUILD_TAGS}" -race -count=1 -shuffle=on -timeout=5m ./...
      - name: Build CLI
        run: go build -trimpath -tags "${BUILD_TAGS}" -o "${RUNNER_TEMP}/sing-box" ./cmd/sing-box
